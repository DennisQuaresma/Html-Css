<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Teste de Formulario</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <p>
            <label for="iusu">Usuario:
                <input type="text" name="iusu" id="iusu" required minlength="5" maxlength="30" size="12" placeholder="Nome do Usuario" autocomplete="username">
            </label>
        </p>
        <p>
            <label for="isen">Senha
                <input type="password" name="sen" id="isen" required minlength="8" maxlength="20" size="10" placeholder="minimo 8 letras" autocomplete="current-password">
            </label>
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
    <!--
    quando eu quiser avisar que um dos dados é obrigatorio devo colocar dentro da tag input  "required"

    minlegth é pra dizer qual é o minimo de digitos que se pode colocar

    maxlegth é pra dizer qual é o maximo de digitos que se pode colocar

    size é pra dizer o tamanho da caixa de texto 

    placeholder é pra deixar um aviso dentro da caixa de texto
    -->
</body>
</html>
